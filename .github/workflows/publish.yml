name: Publish

on:
  workflow_dispatch:
    inputs:
      retry_tag:
        description: 'Retry an unpublished existing tag (e.g. v0.0.2); leave empty for next version'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RETRY_TAG: ${{ inputs.retry_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check publishing credential
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: test -n "$CARGO_REGISTRY_TOKEN" || { echo 'Configure an accessible CARGO_REGISTRY_TOKEN Actions secret first.'; exit 1; }
      - name: Prepare release version
        id: release
        run: python3 .github/scripts/prepare-release.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --release --lib
      - name: Loom concurrency models
        env:
          RUSTFLAGS: --cfg loom -C debug-assertions
        run: cargo test --locked --release loom_ --lib -- --test-threads=1
      - name: Verify publishable package
        run: cargo publish --locked --dry-run --registry crates-io
      - name: Push version commit and tag atomically
        if: inputs.retry_tag == ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$RELEASE_TAG"
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --registry crates-io
